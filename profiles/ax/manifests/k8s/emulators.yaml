# Lab namespace for one AX run, applied with `kubectl apply -f <rendered file>` (placeholders filled by render()).
# Every object carries apl-run=${APL_RUN_ID}; teardown deletes the names in owned-resources.json, then the namespace.
# Secrets emulate-seed and collector-env are created separately from the gitignored run dir.
apiVersion: v1
kind: Namespace
metadata:
  name: apl-ax-${APL_SHORT_ID}
  labels:
    apl-run: "${APL_RUN_ID}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: floci
  namespace: apl-ax-${APL_SHORT_ID}
  labels: { apl-run: "${APL_RUN_ID}", app: floci }
spec:
  replicas: 1
  selector:
    matchLabels: { app: floci }
  template:
    metadata:
      labels: { app: floci, apl-run: "${APL_RUN_ID}" }
    spec:
      automountServiceAccountToken: false
      # Kubernetes service-link env would set FLOCI_PORT=tcp://<ip>:4566, which Floci reads as its own port.
      enableServiceLinks: false
      containers:
        - name: floci
          image: "${APL_FLOCI_IMAGE}"
          env:
            - { name: FLOCI_SERVICES_UI_ENABLED, value: "false" }
          ports: [{ containerPort: 4566 }]
          readinessProbe: { tcpSocket: { port: 4566 }, periodSeconds: 2 }
          resources:
            limits: { cpu: "500m", memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: floci
  namespace: apl-ax-${APL_SHORT_ID}
  labels: { apl-run: "${APL_RUN_ID}" }
spec:
  selector: { app: floci }
  ports: [{ name: http, port: 4566, targetPort: 4566 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emulate
  namespace: apl-ax-${APL_SHORT_ID}
  labels: { apl-run: "${APL_RUN_ID}", app: emulate }
spec:
  replicas: 1
  selector:
    matchLabels: { app: emulate }
  template:
    metadata:
      labels: { app: emulate, apl-run: "${APL_RUN_ID}" }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: emulate
          image: "${APL_EMULATE_IMAGE}"
          env:
            - { name: APL_EMULATE_BASE_URL, value: "http://emulate.apl-ax-${APL_SHORT_ID}.svc.cluster.local:8080" }
            - name: APL_EMULATE_SEED
              valueFrom: { secretKeyRef: { name: emulate-seed, key: seed } }
          ports: [{ containerPort: 8080 }, { containerPort: 8081 }]
          readinessProbe: { httpGet: { path: /_apl/health, port: 8081 }, periodSeconds: 2 }
          resources:
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: emulate
  namespace: apl-ax-${APL_SHORT_ID}
  labels: { apl-run: "${APL_RUN_ID}" }
spec:
  selector: { app: emulate }
  ports:
    - { name: slack, port: 8080, targetPort: 8080 }
    - { name: mailbox, port: 8081, targetPort: 8081 }
---
# Task egress reaches the emulators through Substrate's egress gateway (atenet-egress in ate-system), never
# directly from the worker pods in this namespace. Only the gateway and this run's collector may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: emulators-ingress
  namespace: apl-ax-${APL_SHORT_ID}
  labels: { apl-run: "${APL_RUN_ID}" }
spec:
  podSelector:
    matchExpressions: [{ key: app, operator: In, values: [floci, emulate] }]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: apl-collector } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ate-system } }
          podSelector: { matchLabels: { app: atenet-egress } }
---
# Capacity for this run's AX tasks. The other pools are scaled to zero for the run, so tasks land here.
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: apl-ax-pool
  namespace: apl-ax-${APL_SHORT_ID}
  labels: { apl-run: "${APL_RUN_ID}" }
spec:
  replicas: 1
  sandboxClasses: [{ name: gvisor }]
  workerImage: "${APL_WORKER_IMAGE}"
  template:
    resources:
      limits: { cpu: "3", memory: 4Gi }
      requests: { cpu: "1", memory: 4Gi }
---
# Independent collector: a plain Pod outside the sandbox with its own reader token and S3 credentials, and its own
# pod certificate for the Substrate router (its SPIFFE ID must be in the router's --ingress-allowed-spiffe-ids).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apl-collector
  namespace: apl-ax-${APL_SHORT_ID}
  labels: { apl-run: "${APL_RUN_ID}" }
automountServiceAccountToken: false
---
apiVersion: v1
kind: Pod
metadata:
  name: apl-collector
  namespace: apl-ax-${APL_SHORT_ID}
  labels: { apl-run: "${APL_RUN_ID}", app: apl-collector }
spec:
  serviceAccountName: apl-collector
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Never
  containers:
    - name: collector
      image: "${APL_LAB_IMAGE}"
      command: ["sleep", "infinity"]
      envFrom: [{ secretRef: { name: collector-env } }]
      resources:
        limits: { cpu: "500m", memory: "512Mi" }
      volumeMounts:
        - { name: podidentity, mountPath: /run/podidentity, readOnly: true }
        - { name: servicedns-ca, mountPath: /run/servicedns-ca, readOnly: true }
  volumes:
    - name: podidentity
      projected:
        sources:
          - podCertificate: { signerName: podidentity.podcert.ate.dev/identity, keyType: ECDSAP256, credentialBundlePath: credential-bundle.pem }
    - name: servicedns-ca
      projected:
        sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector: { matchLabels: { podcert.ate.dev/canarying: live } }
              path: trust-bundle.pem
