# Local-core CI: typecheck, unit, integration (Docker on the hosted runner) and mutation probes.
# No secrets, no provider accounts, no deploys. Actions are pinned by full commit SHA.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FLOCI_IMAGE: floci/floci:2.3.0@sha256:e0b292df4dc9559b7b1bf4f51bdda4bb8e269276236438cd03cae661260ea8a9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: npm ci --no-audit --no-fund
      - run: docker pull "$FLOCI_IMAGE"
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Mutation probes (each patch in a throwaway worktree; all must be caught)
        run: npm run mutate
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-results
          path: artifacts/mutations/
          if-no-files-found: ignore
