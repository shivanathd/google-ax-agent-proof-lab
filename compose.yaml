# Floci (AWS S3/SQS emulator). Ports bind to loopback only (F1-R4).
# The project name is set per run (`-p apl-<shortid>`) so concurrent runs never share state.
services:
  floci:
    image: floci/floci:2.3.0@sha256:e0b292df4dc9559b7b1bf4f51bdda4bb8e269276236438cd03cae661260ea8a9
    ports:
      - "127.0.0.1:${FLOCI_PORT:-4566}:4566"
    environment:
      FLOCI_SERVICES_UI_ENABLED: "false"
    labels:
      dev.agent-proof-lab.run-id: "${APL_RUN_ID:-unset}"
